<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1a</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import {Mount} from 'xtal-element/index.js';
        import '/🕹️.js';
        class SoulSearchingBase extends Mount{
            howAmIFeelingAboutToday(targetElement, event){
                console.log({targetElement, event});
            }
        }
        customElements.define('soul-searching-base', SoulSearchingBase);
    </script>
</head>
<body>
    <mood-stone itemscope>
        <soul-searching itemscope -how-am-i-feeling-about-today>
            <xtal-element
                inherits=soul-searching-base
            ></xtal-element>
        </soul-searching>
        <button 🕹️=-how-am-i-feeling-about-today>Feeling great</button>
        <xtal-element></xtal-element>
    </mood-stone>
</body>
</html>
